name: Build and Deploy to VPS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
#      - name: Run tests (optional)
#        run: npm test
#        continue-on-error: false

      - name: Build application
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          
          # Copy built files
          if [ -d "dist" ]; then
            cp -r dist deploy-package/
          fi
          if [ -d "build" ]; then
            cp -r build deploy-package/
          fi
          
          # Copy package files for production dependencies
          cp package.json deploy-package/
          cp package-lock.json deploy-package/

          echo "${{ secrets.APP_CONFIG }}" > deploy-package/dist/.env
          
          # Copy other necessary files (adjust as needed)
          if [ -f "ecosystem.config.js" ]; then
            cp ecosystem.config.js deploy-package/
          fi
          
          # Create tarball
          tar -czf tamilmedia-api-deploy.tar.gz -C deploy-package .

      - name: Upload build to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "tamilmedia-api-deploy.tar.gz"
          target: "/tmp/"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_NAME: tamilmedia-api
          APP_DIR: /var/apps/nodejs_apps/tamilmedia_api
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_NAME,APP_DIR
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion

            cd $APP_DIR
            
            # Extract uploaded build
            tar -xzf /tmp/tamilmedia-api-deploy.tar.gz -C $APP_DIR
            
            # Clean up tarball
            rm /tmp/tamilmedia-api-deploy.tar.gz
            
            # Install production dependencies
            npm ci --omit=dev
            
            # Reload PM2 application using ecosystem config
            pm2 delete $APP_NAME || true
            pm2 start ecosystem.config.js --only $APP_NAME
            # pm2 reload ecosystem.config.js --only $APP_NAME --update-env || pm2 start ecosystem.config.js --only $APP_NAME
            
            # Save PM2 configuration
            pm2 save

            pm2 list
            pm2 show $APP_NAME
            pm2 logs $APP_NAME --lines 20 --nostream
